# Kibaré — messagerie souveraine de l'administration
# Démarrage complet : docker compose up -d
#
# Aucun service tiers : toutes les images sont open source et tous les flux
# restent entre ces conteneurs. La fédération Matrix est désactivée.

name: kibare

x-public-env: &public-env
  PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
  SERVER_NAME: ${SERVER_NAME:-kibare.local}
  PORT_MATRIX: ${PORT_MATRIX:-8008}
  PORT_ELEMENT: ${PORT_ELEMENT:-8080}
  PORT_KEYCLOAK: ${PORT_KEYCLOAK:-8180}
  PORT_CONSOLE: ${PORT_CONSOLE:-8090}

services:
  # 1. Génère les secrets aléatoires (une seule fois) et produit les fichiers
  #    de configuration à partir des modèles de ./config.
  init:
    build: ./admin-console
    command: ["python", "-m", "scripts.init_secrets"]
    environment: *public-env
    volumes:
      - secrets:/secrets
      - rendered:/rendered
      - ./config:/templates:ro
    restart: "no"

  postgres:
    image: postgres:16.6-alpine
    entrypoint: ["/bin/sh", "-c", "set -a && . /secrets/secrets.env && set +a && exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_USER: postgres
      # Synapse exige une base en collation C.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - secrets:/secrets:ro
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Fournisseur d'identité : enrôlement, mot de passe + TOTP, rôles.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -a && . /secrets/secrets.env && set +a &&
        export KC_DB_PASSWORD=$$KEYCLOAK_DB_PASSWORD &&
        export KC_BOOTSTRAP_ADMIN_PASSWORD=$$KEYCLOAK_ADMIN_PASSWORD &&
        mkdir -p /opt/keycloak/data/import &&
        cp /rendered/keycloak/realm-mtdpce.json /opt/keycloak/data/import/ &&
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-bootstrap
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:${PORT_KEYCLOAK:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - secrets:/secrets:ro
      - rendered:/rendered:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Serveur Matrix : ne voit que des messages chiffrés (Olm/Megolm).
  synapse:
    image: ghcr.io/element-hq/synapse:v1.120.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown -R 991:991 /data &&
        gosu 991:991 python -m synapse.app.homeserver
        --config-path /rendered/synapse/homeserver.yaml --generate-keys &&
        exec /start.py
    environment:
      SYNAPSE_CONFIG_PATH: /rendered/synapse/homeserver.yaml
    volumes:
      - rendered:/rendered:ro
      - synapse_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # Client web (fork configuré d'Element).
  element:
    image: vectorim/element-web:v1.11.85
    volumes:
      - ./config/element/config.json:/app/config.json:ro
    restart: unless-stopped

  # Console d'administration : enrôlement, révocation, salons classifiés.
  console:
    build: ./admin-console
    environment: *public-env
    volumes:
      - secrets:/secrets:ro
      - console_data:/data
      - ./config/demo:/app/demo:ro
    depends_on:
      synapse:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # Point d'entrée unique ; bloque l'API d'administration Synapse côté public.
  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "${PORT_MATRIX:-8008}:8008"
      - "${PORT_ELEMENT:-8080}:8080"
      - "${PORT_KEYCLOAK:-8180}:8180"
      # La console n'est joignable que depuis la machine hôte.
      - "127.0.0.1:${PORT_CONSOLE:-8090}:8090"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - synapse
      - element
      - keycloak
      - console
    restart: unless-stopped

volumes:
  secrets:
  rendered:
  postgres_data:
  synapse_data:
  console_data:
